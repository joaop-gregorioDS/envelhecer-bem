services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-EnvelhecerBem!Dev2026}
    ports:
      - "14333:1433"
    volumes:
      - dbdata:/var/opt/mssql

  api:
    build: ./api
    depends_on:
      - db
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=EnvelhecerBem;User Id=sa;Password=${MSSQL_SA_PASSWORD:-EnvelhecerBem!Dev2026};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:-}
      Cors__Origins__0: http://localhost:4200
    ports:
      - "5087:8080"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  dbdata:
